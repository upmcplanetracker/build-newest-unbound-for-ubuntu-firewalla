name: Build Unbound .deb Packages

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      force_version:
        description: 'Force build a specific version (e.g., 1.25.2)'
        required: false
        default: ''

env:
  UPSTREAM_REPO: NLnetLabs/unbound
  DOWNLOAD_BASE: https://nlnetlabs.nl/downloads/unbound

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
      upstream_tag: ${{ steps.parse.outputs.upstream_tag }}
      tarball_url: ${{ steps.parse.outputs.tarball_url }}
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Determine latest Unbound version
        id: parse
        run: |
          if [ -n "${{ github.event.inputs.force_version }}" ]; then
            VERSION="${{ github.event.inputs.force_version }}"
          else
            VERSION=$(curl -sSL "https://api.github.com/repos/${{ env.UPSTREAM_REPO }}/releases/latest" |               jq -r '.tag_name' |               sed 's/^release-//')
          fi

          UPSTREAM_TAG="release-${VERSION}"
          TARBALL_URL="${{ env.DOWNLOAD_BASE }}/unbound-${VERSION}.tar.gz"

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "upstream_tag=${UPSTREAM_TAG}" >> $GITHUB_OUTPUT
          echo "tarball_url=${TARBALL_URL}" >> $GITHUB_OUTPUT
          echo "Latest upstream version: ${VERSION}"
          echo "Tarball URL: ${TARBALL_URL}"

      - name: Check against existing GitHub Releases
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.parse.outputs.version }}"
          TAG_NAME="unbound-${VERSION}"

          LATEST_RELEASE_TAG=$(gh release list --repo ${{ github.repository }} --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || echo "")

          echo "Latest release tag: ${LATEST_RELEASE_TAG}"
          echo "Target tag: ${TAG_NAME}"

          if [ "$LATEST_RELEASE_TAG" = "$TAG_NAME" ] && [ -z "${{ github.event.inputs.force_version }}" ]; then
            echo "Release ${TAG_NAME} already exists. Skipping."
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            echo "Release ${TAG_NAME} is new or forced. Building."
            echo "should_build=true" >> $GITHUB_OUTPUT
          fi

  build-deb:
    needs: check-version
    if: needs.check-version.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - ubuntu_version: "22.04"
            pkg_suffix: "ubuntu22.04"
          - ubuntu_version: "26.04"
            pkg_suffix: "ubuntu26.04"

    runs-on: ubuntu-latest
    container: ubuntu:${{ matrix.ubuntu_version }}

    steps:
      - name: Install build dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends             build-essential wget ca-certificates fakeroot dpkg-dev             libssl-dev libexpat1-dev libevent-dev libnghttp2-dev             libsystemd-dev libprotobuf-c-dev protobuf-c-compiler             libhiredis-dev libfstrm-dev libsodium-dev             python3 python3-dev swig doxygen             bison flex pkg-config

          # libngtcp2-dev and libnghttp3-dev may not exist in older repos.
          # Try to install them, but don't fail the build if they're absent.
          apt-get install -y --no-install-recommends libngtcp2-dev libnghttp3-dev 2>/dev/null || true

      - name: Download Unbound source
        run: |
          TARBALL_URL="${{ needs.check-version.outputs.tarball_url }}"
          VERSION="${{ needs.check-version.outputs.version }}"
          echo "Downloading from: ${TARBALL_URL}"
          wget --retry-connrefused --waitretry=1 --read-timeout=20 --timeout=15 -t 5             -q "$TARBALL_URL" -O "unbound-${VERSION}.tar.gz"
          tar xzf "unbound-${VERSION}.tar.gz"
          ls -la "unbound-${VERSION}/"

      - name: Build Unbound
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          cd "unbound-${VERSION}"

          # Tell configure which Python to use (Ubuntu only ships python3)
          export PYTHON_VERSION=3

          # Conditionally enable DoQ (QUIC) support only if:
          # 1. The libraries are present, AND
          # 2. OpenSSL has QUIC support (requires OpenSSL 3.2+)
          DOQ_FLAGS=""
          if pkg-config --exists libngtcp2 libnghttp3 2>/dev/null; then
            OPENSSL_VER=$(openssl version | awk '{print $2}')
            OPENSSL_MAJOR=$(echo "$OPENSSL_VER" | cut -d. -f1)
            OPENSSL_MINOR=$(echo "$OPENSSL_VER" | cut -d. -f2)
            if [ "$OPENSSL_MAJOR" -gt 3 ] || { [ "$OPENSSL_MAJOR" -eq 3 ] && [ "$OPENSSL_MINOR" -ge 2 ]; }; then
              DOQ_FLAGS="--with-libngtcp2 --with-libnghttp3"
              echo "DoQ libraries found and OpenSSL ${OPENSSL_VER} has QUIC support — enabling DNS-over-QUIC"
            else
              echo "DoQ libraries found but OpenSSL ${OPENSSL_VER} lacks QUIC support (need 3.2+) — skipping DNS-over-QUIC"
            fi
          else
            echo "DoQ libraries NOT found — skipping DNS-over-QUIC"
          fi

          ./configure             --prefix=/usr             --sysconfdir=/etc             --localstatedir=/var             --with-run-dir=/var/run/unbound             --with-username=unbound             --with-libevent             --with-libnghttp2             --with-ssl             --with-libhiredis             --enable-cachedb             --enable-dnscrypt             --enable-dnstap             --enable-subnet             --enable-ipsecmod             --enable-tfo-client             --enable-tfo-server             --enable-systemd             --enable-pie             --with-pythonmodule             --with-pyunbound             --disable-rpath             ${DOQ_FLAGS}             CFLAGS="-O2 -D_FORTIFY_SOURCE=2 -fstack-protector-strong -fPIE"             LDFLAGS="-Wl,-z,relro,-z,now -pie"

          make -j$(nproc)
          mkdir -p /tmp/unbound-pkg
          make DESTDIR=/tmp/unbound-pkg install

      - name: Verify build and modules
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          BIN="/tmp/unbound-pkg/usr/sbin/unbound"

          echo "=== Unbound version and modules ==="
          "${BIN}" -V

          echo ""
          echo "=== Linked libraries ==="
          ldd "${BIN}"

          echo ""
          echo "=== Config check (syntax only) ==="
          # Create a minimal config so unbound-checkconf doesn't bail on missing files
          mkdir -p /tmp/unbound-pkg/etc/unbound
          cat > /tmp/unbound-pkg/etc/unbound/unbound.conf <<'EOF'
          server:
              verbosity: 1
              interface: 127.0.0.1
              port: 53
              username: "unbound"
              directory: "/etc/unbound"
          EOF
          "${BIN}"-checkconf /tmp/unbound-pkg/etc/unbound/unbound.conf || true

      - name: Create .deb package
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          SUFFIX="${{ matrix.pkg_suffix }}"
          PKG_DIR="/tmp/unbound-pkg"
          DEB_DIR="/tmp/unbound-deb"
          ARCH="amd64"

          mkdir -p "${DEB_DIR}/DEBIAN"

          cat > "${DEB_DIR}/DEBIAN/control" <<EOF
          Package: unbound
          Version: ${VERSION}-${SUFFIX}
          Section: net
          Priority: optional
          Architecture: ${ARCH}
          Maintainer: Automated Build <build@localhost>
          Depends: libc6, libssl3, libexpat1, libevent-2.1-7, libnghttp2-14, libsystemd0, libprotobuf-c1, libhiredis1.1.0 | libhiredis1.1.0+ | libhiredis1.1.0-dev | libhiredis1.1.0t64, libfstrm0, libsodium23, python3
          Description: Validating, recursive, caching DNS resolver
           Unbound is a validating, recursive, and caching DNS resolver.
           It is designed as a set of modular components that incorporate
           modern features, such as enhanced security (DNSSEC) validation,
           Internet Protocol Version 6 (IPv6), EDNS Client Subnet, DNS-over-HTTPS,
           DNS-over-QUIC (where supported), dnstap, Redis cachedb, and a client
           resolver library API as an integral part of the architecture.
           Built from upstream tarball for ${SUFFIX} with hardening flags.
          EOF

          cp -a "${PKG_DIR}/." "${DEB_DIR}/" 2>/dev/null || true

          if [ ! -f "${DEB_DIR}/lib/systemd/system/unbound.service" ] && [ ! -f "${DEB_DIR}/usr/lib/systemd/system/unbound.service" ]; then
            mkdir -p "${DEB_DIR}/lib/systemd/system"
            cat > "${DEB_DIR}/lib/systemd/system/unbound.service" <<'EOF'
          [Unit]
          Description=Unbound DNS server
          Documentation=man:unbound(8)
          After=network.target
          Before=nss-lookup.target
          Wants=nss-lookup.target

          [Service]
          Type=simple
          EnvironmentFile=-/etc/default/unbound
          ExecStart=/usr/sbin/unbound -d $DAEMON_OPTS
          ExecReload=/usr/sbin/unbound-control reload
          Restart=on-failure

          [Install]
          WantedBy=multi-user.target
          EOF
          fi

          mkdir -p "${DEB_DIR}/etc/default"
          if [ ! -f "${DEB_DIR}/etc/default/unbound" ]; then
            cat > "${DEB_DIR}/etc/default/unbound" <<'EOF'
          # Options for unbound
          DAEMON_OPTS=""
          EOF
          fi

          dpkg-deb --root-owner-group --build "${DEB_DIR}"             "/tmp/unbound_${VERSION}-${SUFFIX}_${ARCH}.deb"

          echo "=== Package info ==="
          dpkg-deb -I "/tmp/unbound_${VERSION}-${SUFFIX}_${ARCH}.deb"
          echo "=== Package contents ==="
          dpkg-deb -c "/tmp/unbound_${VERSION}-${SUFFIX}_${ARCH}.deb"

      - name: Generate checksum
        run: |
          cd /tmp
          sha256sum "unbound_${{ needs.check-version.outputs.version }}-${{ matrix.pkg_suffix }}_amd64.deb" > "SHA256SUMS-${{ matrix.pkg_suffix }}"
          cat "SHA256SUMS-${{ matrix.pkg_suffix }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: unbound-${{ needs.check-version.outputs.version }}-${{ matrix.pkg_suffix }}-amd64
          path: |
            /tmp/unbound_${{ needs.check-version.outputs.version }}-${{ matrix.pkg_suffix }}_amd64.deb
            /tmp/SHA256SUMS-${{ matrix.pkg_suffix }}
          retention-days: 90

  release:
    needs: [check-version, build-deb]
    if: needs.check-version.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          pattern: unbound-${{ needs.check-version.outputs.version }}-*
          merge-multiple: true

      - name: Merge checksums
        run: |
          cd ./artifacts
          cat SHA256SUMS-* > SHA256SUMS
          rm -f SHA256SUMS-*
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: unbound-${{ needs.check-version.outputs.version }}
          name: "Unbound ${{ needs.check-version.outputs.version }}"
          body: |
            Automated build of Unbound ${{ needs.check-version.outputs.version }} for Ubuntu.

            | File | Target |
            |------|--------|
            | `unbound_${{ needs.check-version.outputs.version }}-ubuntu22.04_amd64.deb` | Ubuntu 22.04 (Jammy) |
            | `unbound_${{ needs.check-version.outputs.version }}-ubuntu26.04_amd64.deb` | Ubuntu 26.04 |

            **Firewalla note:** The Ubuntu 22.04 package should also work on 26.04 due to glibc backward compatibility. Install with:
            ```bash
            sudo dpkg -i unbound_*.deb
            # or
            sudo apt install ./unbound_*.deb
            ```

            **Post-install:** Ensure the `unbound` user exists before starting the service:
            ```bash
            sudo useradd -r -s /bin/false unbound 2>/dev/null || true
            sudo mkdir -p /var/run/unbound
            sudo chown unbound:unbound /var/run/unbound
            sudo systemctl enable --now unbound
            ```

            **Verify the package:**
            ```bash
            sha256sum -c SHA256SUMS
            unbound -V
            ```
          files: ./artifacts/*
          fail_on_unmatched_files: true
